<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCSE History Revision — AQA 8145BC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e1e;--card:rgba(255,255,255,0.055);--cb:rgba(255,255,255,0.1);
  --blue:#4d9de0;--gold:#f0c040;--grn:#52c788;--red:#e05555;--lav:#9b8ecf;
  --txt:#e8eaf6;--mu:rgba(232,234,246,0.5);--r:12px;--rs:8px;
  --ger:#4d9de0;--con:#9b8ecf;--skl:#f0c040;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(77,157,224,0.07) 0%,transparent 65%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-200px;right:-150px;width:550px;height:550px;background:radial-gradient(circle,rgba(240,192,64,0.05) 0%,transparent 65%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:22px 16px 60px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.3)}65%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.fu{animation:fadeUp 0.38s ease both}
/* HOME */
.h-icon{font-size:36px;display:block;text-align:center;margin-bottom:10px}
.h-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;text-align:center;margin-bottom:4px;background:linear-gradient(135deg,var(--blue) 0%,var(--lav) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.h-sub{font-size:12px;color:var(--mu);text-align:center;margin-bottom:6px;line-height:1.5}
.h-warn{background:rgba(240,192,64,0.1);border:1px solid rgba(240,192,64,0.25);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:var(--gold);line-height:1.6;margin-bottom:20px;text-align:center}
/* PROGRESS */
.mp{background:var(--card);border:1px solid var(--cb);border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
.mp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mp-lbl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--mu)}
.mp-pct{font-size:18px;font-weight:600;color:var(--blue)}
.ptrack{height:5px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width 0.7s cubic-bezier(0.34,1.56,0.64,1)}
.pfill-main{background:linear-gradient(90deg,var(--blue),var(--lav))}
/* SECTION CARDS */
.sec-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.sc{background:var(--card);border:1px solid var(--cb);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;display:flex;align-items:center;gap:16px}
.sc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 2px}
.sc:hover{background:rgba(255,255,255,0.08);transform:translateX(3px)}
.sc-ico{font-size:28px;flex-shrink:0}
.sc-body{flex:1}
.sc-tag{font-size:9px;font-weight:600;letter-spacing:0.13em;text-transform:uppercase;margin-bottom:4px;opacity:0.7}
.sc-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-bottom:5px;line-height:1.2}
.sc-desc{font-size:12px;color:var(--mu);line-height:1.5}
.sc-prog{margin-top:8px}
.sc-ptrack{height:3px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
.sc-pfill{height:100%;border-radius:99px;transition:width 0.5s}
.sc-arr{color:var(--mu);font-size:18px;flex-shrink:0}
/* NAV */
.nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:none;border:none;color:var(--mu);cursor:pointer;font:13px 'Outfit',sans-serif;padding:0;transition:color 0.15s}
.back:hover{color:var(--txt)}
.nav-trail{font-size:11px;color:var(--mu);margin-left:auto}
/* SECTION HEADER */
.sh{background:var(--card);border:1px solid var(--cb);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.sh-bar{position:absolute;top:0;left:0;right:0;height:3px}
.sh-icon{font-size:28px;margin-bottom:8px;display:block}
.sh-tag{font-size:9px;font-weight:600;letter-spacing:0.13em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.sh-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:6px}
.sh-sub{font-size:12px;color:var(--mu);line-height:1.55}
/* TOPIC CARDS */
.tc{background:var(--card);border:1px solid var(--cb);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all 0.2s;margin-bottom:9px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.tc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px}
.tc:hover{background:rgba(255,255,255,0.08);transform:translateX(3px)}
.tc-body{flex:1}
.tc-num{font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--mu);margin-bottom:3px}
.tc-name{font-size:14px;font-weight:500}
.tc-dates{font-size:11px;color:var(--mu);margin-top:3px}
.tc-icon{font-size:20px;flex-shrink:0}
.tc-badge{font-size:10px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,0.06);color:var(--mu);flex-shrink:0}
/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:6px 14px;border-radius:99px;font:13px 'Outfit',sans-serif;cursor:pointer;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:var(--mu);transition:all 0.18s}
.tab:hover:not(.active){background:rgba(255,255,255,0.07)}
.tab.active{font-weight:500}
.tab.done-t{background:rgba(82,199,136,0.08);border-color:rgba(82,199,136,0.3);color:var(--grn)}
/* FLASHCARDS */
.fc-intro{font-size:12px;color:var(--mu);margin-bottom:12px;line-height:1.6}
.fc-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fc{background:var(--card);border:1px solid var(--cb);border-radius:var(--rs);padding:13px 15px;cursor:pointer;transition:all 0.18s}
.fc:hover{background:rgba(255,255,255,0.07)}
.fc.open{border-color:rgba(77,157,224,0.35);background:rgba(77,157,224,0.07)}
.fc-term{font-size:14px;font-weight:500;line-height:1.3;margin-bottom:0}
.fc-def{font-size:13px;color:var(--mu);line-height:1.65;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,0.07);display:none;white-space:pre-line}
.fc.open .fc-def{display:block}
.fc-hint{font-size:10px;color:rgba(232,234,246,0.3);margin-top:4px}
/* TIMELINE */
.tl{display:flex;flex-direction:column;gap:0;margin-bottom:16px}
.tl-item{display:flex;gap:12px;padding:0 0 12px 0}
.tl-left{display:flex;flex-direction:column;align-items:center;width:52px;flex-shrink:0}
.tl-year{font-size:11px;font-weight:600;color:var(--blue);text-align:center;line-height:1.2;margin-bottom:4px}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.tl-line{width:1px;flex:1;background:rgba(77,157,224,0.2);margin-top:4px}
.tl-content{flex:1;padding-top:0}
.tl-event{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px}
.tl-detail{font-size:12px;color:var(--mu);line-height:1.5}
/* QUESTIONS */
.q-card{background:var(--card);border:1px solid var(--cb);border-radius:var(--r);padding:16px;margin-bottom:12px}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.q-type{font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,0.06);color:var(--mu)}
.q-marks{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(240,192,64,0.12);color:var(--gold);border:1px solid rgba(240,192,64,0.2)}
.q-time{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(82,199,136,0.1);color:var(--grn);border:1px solid rgba(82,199,136,0.2)}
.q-text{font-size:14px;font-weight:500;line-height:1.55;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.07)}
.q-bullets{margin-bottom:12px}
.q-bullet{display:flex;gap:8px;font-size:12px;color:var(--mu);padding:4px 0;line-height:1.5}
.q-bdot{color:var(--blue);flex-shrink:0}
.q-timer-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--rs);background:rgba(77,157,224,0.12);border:1px solid rgba(77,157,224,0.3);color:var(--blue);font:500 13px 'Outfit',sans-serif;cursor:pointer;transition:all 0.18s;width:100%;justify-content:center;margin-bottom:10px}
.q-timer-btn:hover{background:rgba(77,157,224,0.2)}
/* TIMER */
.timer-panel{background:rgba(10,15,35,0.98);border:1px solid var(--cb);border-radius:var(--r);padding:16px;margin-bottom:14px;position:sticky;top:8px;z-index:100}
.timer-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.timer-display{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;min-width:80px}
.timer-display.green{color:var(--grn)}
.timer-display.amber{color:var(--gold)}
.timer-display.red{color:var(--red);animation:pulse 0.8s infinite}
.timer-label{font-size:11px;color:var(--mu);line-height:1.4}
.timer-label strong{display:block;font-size:13px;color:var(--txt)}
.timer-prog{height:5px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;margin-bottom:10px}
.timer-pfill{height:100%;border-radius:99px;transition:width 0.9s linear,background 0.5s}
.timer-btns{display:flex;gap:8px}
.tbtn{padding:7px 14px;border-radius:var(--rs);font:12px 'Outfit',sans-serif;cursor:pointer;transition:all 0.18s;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--mu)}
.tbtn:hover{background:rgba(255,255,255,0.08);color:var(--txt)}
.tbtn.stop{color:var(--red);border-color:rgba(224,85,85,0.3)}
.timer-hints{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.07)}
.timer-hints p{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.hint-item{font-size:11px;color:var(--mu);padding:3px 0;line-height:1.4}
.hint-item span{color:var(--blue);font-weight:500}
/* MODEL ANSWERS */
.grade-compare{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.gc-panel{border-radius:var(--rs);padding:14px;font-size:12px;line-height:1.7}
.gc-panel.grade5{background:rgba(224,85,85,0.06);border:1px solid rgba(224,85,85,0.2)}
.gc-panel.grade8{background:rgba(82,199,136,0.07);border:1px solid rgba(82,199,136,0.2)}
.gc-label{font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
.gc-label.l5{color:var(--red)}
.gc-label.l8{color:var(--grn)}
.gc-text{color:var(--mu)}
.gc-text strong{color:var(--txt);font-weight:500}
.gc-diff{background:rgba(255,255,255,0.04);border-radius:var(--rs);padding:12px;margin-top:10px}
.gc-diff p{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.gc-diff-item{display:flex;gap:8px;font-size:12px;color:var(--mu);padding:4px 0;line-height:1.5}
.gc-diff-dot{color:var(--gold);flex-shrink:0}
.reveal-btn{padding:8px 16px;border-radius:var(--rs);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);font:12px 'Outfit',sans-serif;color:var(--mu);cursor:pointer;transition:all 0.18s;margin-top:8px}
.reveal-btn:hover{background:rgba(255,255,255,0.07);color:var(--txt)}
/* SPELLINGS */
.sp-intro{font-size:12px;color:var(--mu);margin-bottom:14px;line-height:1.6}
.sp-card{background:var(--card);border:1px solid var(--cb);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.sp-clue{font-size:13px;color:var(--mu);margin-bottom:10px;line-height:1.5}
.sp-clue strong{color:var(--txt);font-weight:500}
.sp-input-row{display:flex;gap:8px;align-items:stretch}
.sp-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:var(--rs);padding:9px 12px;font:14px 'Outfit',sans-serif;color:var(--txt);outline:none;transition:border-color 0.18s}
.sp-input:focus{border-color:rgba(77,157,224,0.5)}
.sp-input.correct{border-color:rgba(82,199,136,0.5);background:rgba(82,199,136,0.07)}
.sp-input.wrong{border-color:rgba(224,85,85,0.5);background:rgba(224,85,85,0.07)}
.sp-check{padding:9px 16px;border-radius:var(--rs);background:rgba(77,157,224,0.12);border:1px solid rgba(77,157,224,0.3);color:var(--blue);font:500 12px 'Outfit',sans-serif;cursor:pointer;white-space:nowrap;transition:all 0.18s}
.sp-check:hover{background:rgba(77,157,224,0.2)}
.sp-result{font-size:12px;margin-top:8px;line-height:1.5;display:none}
.sp-result.show{display:block}
.sp-result.ok{color:var(--grn)}
.sp-result.bad{color:var(--red)}
/* SUSTAINED JUDGEMENT */
.sj-box{background:rgba(240,192,64,0.07);border:1px solid rgba(240,192,64,0.2);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sj-head{font-size:10px;font-weight:600;letter-spacing:0.13em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.sj-body{font-size:13px;color:var(--mu);line-height:1.7}
.sj-body strong{color:var(--txt);font-weight:500}
.sj-compare{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sj-row{padding:10px 12px;border-radius:var(--rs);font-size:12px;line-height:1.6}
.sj-row.bad{background:rgba(224,85,85,0.07);border:1px solid rgba(224,85,85,0.2)}
.sj-row.good{background:rgba(82,199,136,0.07);border:1px solid rgba(82,199,136,0.2)}
.sj-row-lbl{font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:5px}
.sj-row.bad .sj-row-lbl{color:var(--red)}
.sj-row.good .sj-row-lbl{color:var(--grn)}
.sj-row-text{color:var(--mu)}
.sj-row-text em{color:var(--txt);font-style:normal;font-weight:500}
/* STRUCTURE GUIDE */
.struct-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.struct-item:last-child{border-bottom:none}
.struct-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:rgba(77,157,224,0.12);color:var(--blue);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.struct-body{flex:1}
.struct-title{font-size:13px;font-weight:500;margin-bottom:4px}
.struct-desc{font-size:12px;color:var(--mu);line-height:1.55}
.struct-time{font-size:10px;color:var(--gold);font-weight:600;margin-top:3px}
/* SOURCE ANALYSIS */
.sa-step{background:var(--card);border:1px solid var(--cb);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px}
.sa-step-num{font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--lav);margin-bottom:6px}
.sa-step-title{font-size:13px;font-weight:500;margin-bottom:5px}
.sa-step-text{font-size:12px;color:var(--mu);line-height:1.6}
.sa-template{background:rgba(155,142,207,0.08);border:1px solid rgba(155,142,207,0.25);border-radius:var(--rs);padding:12px;margin:10px 0;font-size:13px;line-height:1.7;color:var(--mu)}
.sa-template em{color:var(--lav)}
/* PHRASES BANK */
.phrases{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.phrase{background:rgba(77,157,224,0.07);border:1px solid rgba(77,157,224,0.2);border-radius:var(--rs);padding:9px 12px;font-size:13px;color:var(--blue);cursor:pointer;transition:all 0.18s}
.phrase:hover{background:rgba(77,157,224,0.14)}
.phrase-copied{background:rgba(82,199,136,0.1);border-color:rgba(82,199,136,0.3);color:var(--grn)}
/* KEY PEOPLE */
.people-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.person{background:var(--card);border:1px solid var(--cb);border-radius:var(--rs);padding:12px 14px}
.person-name{font-size:13px;font-weight:600;margin-bottom:3px}
.person-role{font-size:10px;color:var(--gold);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px}
.person-sig{font-size:12px;color:var(--mu);line-height:1.55}
/* GENERAL */
.sec-title{font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--mu);margin:16px 0 10px}
.div{height:1px;background:rgba(255,255,255,0.06);margin:14px 0}
.warn-box{background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.2);border-radius:var(--rs);padding:11px 14px;font-size:12px;color:rgba(224,85,85,0.85);line-height:1.6;margin-bottom:12px}
.info-box{background:rgba(77,157,224,0.07);border:1px solid rgba(77,157,224,0.2);border-radius:var(--rs);padding:11px 14px;font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:10px}
.info-box strong{color:var(--blue)}
.spag-tip{background:rgba(155,142,207,0.07);border:1px solid rgba(155,142,207,0.2);border-radius:var(--rs);padding:10px 12px;font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:8px}
.spag-tip strong{color:var(--lav)}
.btn-p{display:block;width:100%;padding:12px;border-radius:var(--rs);background:linear-gradient(135deg,var(--blue),var(--lav));border:none;font:500 13px 'Outfit',sans-serif;color:#fff;cursor:pointer;transition:opacity 0.18s;margin-top:12px}
.btn-p:hover{opacity:0.88}
.btn-g{padding:8px 16px;border-radius:var(--rs);background:var(--card);border:1px solid var(--cb);font:12px 'Outfit',sans-serif;color:var(--mu);cursor:pointer;transition:all 0.18s}
.btn-g:hover{background:rgba(255,255,255,0.07);color:var(--txt)}
.act-done{text-align:center;padding:14px;background:rgba(82,199,136,0.07);border:1px solid rgba(82,199,136,0.2);border-radius:var(--r);margin-top:10px}
/* CHECKLIST */
.cl-item{display:flex;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--cb);border-radius:var(--rs);margin-bottom:6px;cursor:pointer;transition:all 0.18s}
.cl-item.checked{background:rgba(82,199,136,0.07);border-color:rgba(82,199,136,0.25)}
.cl-box{flex-shrink:0;width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px;transition:all 0.18s}
.cl-item.checked .cl-box{background:var(--grn);border-color:var(--grn)}
.cl-text{font-size:12px;color:var(--mu);line-height:1.5}
.cl-item.checked .cl-text{color:var(--txt)}
@media(max-width:380px){.sp-input-row{flex-direction:column}.sp-check{width:100%}}
</style>
</head>
<body><div id="app"></div>
<script>
const D={
sections:[
{id:'ger',icon:'🏛️',tag:'AQA 8145BC — Section A',title:'Germany 1890–1945',desc:'Weimar Republic · Rise of Hitler · Nazi Germany',col:'var(--ger)',
topics:[
{id:'weimar',num:1,title:'The Weimar Republic',dates:'1919–1929',icon:'📜',
facts:[
['The Weimar Republic is established (1919)','Formed after Kaiser Wilhelm II abdicated on 9 November 1918. Germany became a democratic republic with a new constitution. Friedrich Ebert became the first President. Named after the town of Weimar where the constitution was drawn up. Germany faced enormous problems from the start — it was associated with defeat and the hated Treaty of Versailles.'],
['The Treaty of Versailles (June 1919)','Imposed on Germany without negotiation (a "diktat"). Key terms: War Guilt Clause (Article 231) forced Germany to accept blame for WWI; £6.6 billion reparations; army limited to 100,000 men, no air force, limited navy; loss of 13% of land (Rhineland demilitarised, Alsace-Lorraine to France, Polish Corridor created, colonies lost). Germans called it a "stab in the back."'],
['The Spartacist Revolt (January 1919)','Left-wing communist uprising led by Rosa Luxemburg and Karl Liebknecht. Attempted to seize power in Berlin. Ebert used the Freikorps (right-wing ex-soldiers) to crush it — Luxemburg and Liebknecht were murdered. This showed the Weimar government would use extreme right-wing forces against the left, making the Weimar Republic enemies on both sides.'],
['The Kapp Putsch (March 1920)','Right-wing nationalist Wolfgang Kapp marched on Berlin with Freikorps troops and declared a new government. The army refused to fire on Freikorps. The putsch was defeated by a GENERAL STRIKE — workers stopped transport and utilities. Showed right-wing threat was real, but also that the working class could defend democracy.'],
['The Crises of 1923','January: France and Belgium occupied the Ruhr (Germany\'s industrial heartland) after Germany defaulted on reparations. Ebert ordered "passive resistance" (workers went on strike). This caused massive printing of money — hyperinflation. By November 1923, 4.2 trillion marks = $1. Savings became worthless. Middle class hardest hit. November: Munich (Beer Hall) Putsch — Hitler\'s failed coup.'],
['The Munich Putsch (November 1923)','Hitler attempted to seize power in Bavaria. Marched on Munich with 2,000 SA men. The army opened fire — 16 Nazis killed. Hitler was arrested, tried for treason (lenient judges — 5 year sentence, served 9 months). In prison wrote Mein Kampf. The failure taught Hitler to seek power through democratic means.'],
['The Stresemann Era / "Golden Twenties" (1924–1929)','Stresemann became Chancellor (1923), then Foreign Minister. Key achievements: Rentenmark replaced worthless currency; Dawes Plan (1924) — US loans to Germany, reparations restructured; Locarno Treaties (1925) — improved relations with France/Britain; Germany joins League of Nations (1926); Young Plan (1929) — reparations reduced. Germany experienced relative stability and cultural flowering.'],
['Weimar Germany\'s structural weaknesses','Proportional representation meant many small parties — coalition governments were unstable. Article 48 allowed President to rule by emergency decree — bypassing parliament. Many judges, civil servants, and military officers were conservative/anti-democratic. The republic was associated with defeat and the hated Versailles Treaty from the start.']
],

questions:[
{type:'EXPLAIN WHY',marks:12,mins:15,q:'Explain why the Weimar Republic faced so many problems in the years 1919–1923. You may use the following in your answer: the Treaty of Versailles; hyperinflation. You must also use information of your own.',bullets:['The Versailles Treaty caused resentment — Germany blamed the republic','Hyperinflation destroyed savings — hit the middle class hardest','The Kapp Putsch showed right-wing opposition; Spartacists showed left-wing threat','US loan dependency (Dawes Plan) left Germany vulnerable'],
g5:'The Weimar Republic faced many problems. One problem was the Treaty of Versailles which was very harsh on Germany. Germany had to pay reparations of £6.6 billion and lost territory. This made people angry. Another problem was hyperinflation in 1923 when prices rose very quickly. People\'s savings became worthless. The republic also faced the Kapp Putsch in 1920 when right-wing soldiers tried to take over Berlin. In conclusion the Weimar Republic faced many problems because of the Treaty of Versailles and economic problems.',
g8:'The Weimar Republic faced enormous problems in this period, primarily because it was born in defeat and immediately associated with the humiliation of the Versailles Treaty. The War Guilt Clause (Article 231) forced Germany to accept sole blame for WWI and pay £6.6 billion in reparations — terms that the German public considered outrageous and unjust. Consequently, the republic was politically poisoned from birth: nationalists labelled its leaders the "November Criminals" who had "stabbed Germany in the back," making stable government almost impossible.\n\nThe reparations crisis directly caused the second major problem: the hyperinflation of 1923. When Germany defaulted on reparations payments, France occupied the Ruhr. Ebert\'s policy of passive resistance — encouraging workers to strike — meant the government had to print money to pay strikers. By November 1923, 4.2 trillion marks equalled just one dollar, wiping out the savings of the middle class entirely. This was not simply an economic crisis — it destroyed confidence in the republic itself, as millions of Germans who had previously supported Weimar now turned against it.\n\nThird, the republic\'s own structural weaknesses made it unable to deal effectively with these challenges. Proportional representation produced fragile coalition governments, while Article 48 — allowing presidential rule by decree — undermined parliamentary democracy. The republic thus faced external shocks (Versailles, reparations, foreign occupation) and internal enemies (Spartacists on the left, Freikorps on the right) while simultaneously suffering from a constitution that made strong, consistent government nearly impossible. These problems combined to make the early Weimar years a period of chronic instability.',
diff:['Grade 5 lists problems without explaining WHY each one mattered to the republic\'s survival','Grade 8 shows HOW problems connected — Versailles → reparations crisis → occupation → hyperinflation is one chain, not three separate points','Grade 5 concludes without judgement. Grade 8 makes a sustained argument throughout: the republic was fatally weakened from the start','Grade 8 uses specific evidence: "4.2 trillion marks = $1", "Article 48", "November Criminals" — names and numbers demonstrate precise knowledge']},
{type:'HOW FAR DO YOU AGREE',marks:20,mins:22,q:'"The main reason for the weakness of the Weimar Republic was the Treaty of Versailles." How far do you agree with this statement? Explain your answer.',bullets:['Treaty of Versailles — economic and political impact','Proportional representation and Article 48 — structural weaknesses','Opposition from extremists — left (Spartacists) and right (Kapp, Hitler)','Economic crises of 1923 — hyperinflation'],
g5:'I largely agree with this statement. The Treaty of Versailles was very important because it forced Germany to pay reparations and accept the War Guilt Clause. This made Germans angry. However, there were other reasons too. The Weimar Republic had problems with its constitution. Proportional representation meant many parties and unstable governments. There was also opposition from extremists like the Spartacists and the Kapp Putsch. The economic problems of 1923 were also important. In conclusion, the Treaty of Versailles was the main reason but there were other reasons too.',
g8:'I largely agree that the Treaty of Versailles was the most significant reason for the Weimar Republic\'s weakness, though the republic\'s own constitutional flaws compounded this external pressure in ways that made stable government almost impossible.\n\nThe Treaty of Versailles was catastrophic for Weimar democracy because it politically delegitimised the republic before it had even established itself. The War Guilt Clause forced Germany to accept sole blame for WWI and pay £6.6 billion in reparations — terms that the German public considered a national humiliation. Nationalists immediately branded Weimar\'s leaders the "November Criminals," associating the republic with defeat and betrayal. This therefore supports the statement because it shows that Versailles did not merely create economic problems — it fundamentally undermined the republic\'s political legitimacy in the eyes of many German citizens.\n\nHowever, the republic\'s own structural weaknesses were an independent source of vulnerability that would have threatened any democratic government. Proportional representation produced chronic governmental instability: by 1933, Germany had had twenty separate coalition governments in fourteen years. Article 48 of the Weimar constitution allowed the President to rule by emergency decree, bypassing the Reichstag — a mechanism that Hitler would later exploit to dismantle democracy from within. These were not products of Versailles but self-inflicted constitutional flaws. Nevertheless, these weaknesses became fatal only when combined with the external pressures created by Versailles, suggesting that both factors were necessary conditions for the republic\'s collapse.\n\nIn conclusion, I largely agree with the statement, but the degree of agreement requires qualification. The Treaty of Versailles was the primary cause because it poisoned public attitudes towards the republic and created the economic conditions (reparations → hyperinflation) that destroyed popular confidence. However, without the republic\'s own constitutional vulnerabilities — particularly proportional representation and Article 48 — Versailles alone might have been survivable. The Weimar Republic was not simply a victim of external forces: it was structurally designed in a way that made it unable to withstand them.',
diff:['Grade 5 conclusion says "mainly agree but other reasons too" — gives NO DEGREE. Grade 8 gives a degree: identifies specifically what Versailles did that constitutional flaws could not do alone','Grade 5 never links paragraphs back to the question. Grade 8 ends every paragraph with "this therefore supports/challenges the statement BECAUSE..."','Grade 8 has a "clever however": acknowledges constitutional flaws were serious, but then shows why Versailles was STILL most important (necessary conditions argument)','Grade 8 uses linking language throughout: "This therefore supports," "Nevertheless," "compounded this"']}
],
spellings:[['reparations','Payments demanded from Germany after WWI (rhymes with "preparations" — same letters, add "r")'],['hyperinflation','When money becomes almost worthless very quickly (hyper + inflation — think "hyper" like hyperactive)'],['plebiscite','A vote by the people on a specific political issue (plee-bi-site — not "plebi-cit-e")'],['Spartacist','Member of the communist revolutionary group (Spar-ta-cist — three syllables)'],['armistice','The agreement to stop fighting at the end of WWI (arm-is-tice — three syllables)'],['sovereignty','Supreme power of a state — self-governance (sov-er-eign-ty — the "eign" is the tricky part)']]},

{id:'rise',num:2,title:'The Rise of Hitler',dates:'1929–1933',icon:'📈',
facts:[
['Impact of the Wall Street Crash (1929)','US stock market collapsed in October 1929 — US banks recalled their loans to Germany. German businesses collapsed, unemployment rose from 1.3 million (1929) to 6 million by 1932. The Great Depression destroyed the economic stability that Stresemann had built. It destroyed Weimar\'s credibility and created conditions for extremism.'],
['Nazi electoral breakthrough (1930–1932)','In 1928, Nazis had just 12 Reichstag seats (2.6%). By September 1930 they had 107 seats (18.3%). By July 1932 they had 230 seats (37.4%) — the largest single party. In November 1932 they fell slightly to 196 seats (33.1%) — showing Nazi support may have peaked. Hitler demanded to be made Chancellor; Hindenburg initially refused, calling him "the Bohemian corporal."'],
['Hitler\'s appeal','Hitler\'s speeches offered simple explanations for complex problems: blamed Jews and communists for Germany\'s suffering; promised to tear up Versailles, restore German greatness, and eliminate unemployment. His oratory was electrifying — carefully staged rallies, dramatic lighting, rousing music. SA provided excitement and a sense of order. For unemployed young men, the Nazi movement offered purpose and belonging.'],
['Role of Goebbels and Nazi propaganda','Joseph Goebbels orchestrated Nazi electoral campaigns from 1930 onwards. Hitler was portrayed as a messianic saviour — "Der Führer." Posters, rallies, and newsreel films created a powerful modern propaganda machine. Key message was different for different audiences: to farmers (protect agricultural prices), to middle class (anti-communist order), to workers (national community and jobs).'],
['Why Hindenburg appointed Hitler Chancellor (January 1933)','By November 1932, Nazis had slightly declined. Franz von Papen (former Chancellor) convinced Hindenburg that Hitler could be "controlled" if given office with conservatives around him. Hindenburg appointed Hitler as Chancellor on 30 January 1933, with von Papen as Vice Chancellor. Conservatives thought they could use Hitler — one of the most catastrophic miscalculations in history.'],
['The Reichstag Fire (February 1933)','On 27 February 1933, the Reichstag building burned down. A young Dutch communist, Marinus van der Lubbe, was found at the scene. Hitler immediately blamed communist conspiracy and persuaded Hindenburg to sign the Reichstag Fire Decree, suspending civil liberties (free speech, right to fair trial). Historians debate whether the Nazis started the fire themselves.'],
['The Enabling Act (March 1933)','On 23 March 1933, the Reichstag voted to give Hitler power to make laws without consulting parliament for 4 years. Passed 444 to 94 — only the Social Democrats voted against. SA men surrounded the chamber — intimidating opposition. The Enabling Act was the legal foundation of the Nazi dictatorship: Hitler could now rule by decree. All parties banned by July 1933.'],
['Why the Weimar Republic fell','Multiple interconnected reasons: economic crisis (Depression) destroyed public confidence; Nazi propaganda exploited resentment; SA violence intimidated opponents; conservatives (Hindenburg, Papen) underestimated Hitler; Weimar constitution\'s weaknesses (Article 48, proportional representation) left it vulnerable; democratic parties failed to unite against the Nazi threat.']
],

['Oct 1929','Wall Street Crash — US loans to Germany recalled; unemployment soars'],

people:[
{name:'Adolf Hitler',role:'NSDAP leader and Chancellor from 30 January 1933',sig:'Charismatic orator who could read and exploit his audience. Wrote Mein Kampf in prison (1924). Decided after Munich Putsch to seek power legally. Exploited the Great Depression brilliantly, offering simple explanations and scapegoats.'},
{name:'Paul von Hindenburg',role:'President of Germany (1925–1934)',sig:'Initially refused to appoint Hitler Chancellor, calling him an "Austrian corporal." Was eventually persuaded by von Papen that conservatives could control Hitler. His miscalculation opened the door to dictatorship.'},
{name:'Franz von Papen',role:'Former Chancellor and Hindenburg\'s advisor',sig:'Convinced Hindenburg to appoint Hitler. Believed conservatives could "tame" Hitler with senior positions around him. Instead became increasingly sidelined as Hitler consolidated power.'}
],
questions:[
{type:'HOW FAR DO YOU AGREE',marks:20,mins:22,q:'"The main reason for Hitler\'s rise to power was the economic depression of 1929–1932." How far do you agree with this statement? Explain your answer.',bullets:['The Great Depression — 6 million unemployed by 1932; confidence in Weimar collapsed','Nazi propaganda and Hitler\'s personal appeal','Weakness of opposition — conservatives underestimating Hitler','Weimar\'s structural weaknesses — coalition instability, Article 48'],
g5:'I agree with this statement to a large extent. The economic depression of 1929 was very important because it caused unemployment of 6 million by 1932. People lost faith in the Weimar Republic and turned to extremists like Hitler. However, there were other reasons. Nazi propaganda was also important as Goebbels ran effective campaigns. The Enabling Act also helped Hitler take power. In conclusion, the depression was the main reason but other factors also contributed.',
g8:'I largely agree that the Great Depression was the most significant factor in Hitler\'s rise to power, because without it the structural weakness of Weimar and the appeal of Nazi propaganda would not have been sufficient to bring Hitler to the chancellorship. However, the depression alone cannot fully explain his rise — it was the combination of economic crisis and pre-existing political vulnerabilities that made the outcome possible.\n\nThe Wall Street Crash of 1929 triggered a catastrophic economic collapse in Germany: unemployment rose from 1.3 million in 1929 to 6 million by 1932, wiping out any confidence in the Weimar Republic that Stresemann had painstakingly built. The Nazi vote surged in direct proportion — from 12 seats in 1928 to 230 by July 1932. This correlation demonstrates that economic desperation, not ideological conviction, drove most Nazi support. Voters turned to Hitler because democratic alternatives had failed them, not because they fully endorsed Nazi ideology. This therefore supports the statement: without the depression, the Nazis were a fringe party going nowhere.\n\nHowever, the depression alone does not explain why Hitler specifically — as opposed to other right-wing parties — benefited most. This requires recognising the significance of Nazi propaganda and Hitler\'s personal appeal. Goebbels created a modern, sophisticated propaganda machine that tailored different messages to different audiences: economic security for the middle class, anti-communism for conservatives, national greatness for all. Hitler\'s oratorical power — staged rallies, dramatic lighting, rousing speeches — created a quasi-religious political movement that offered belonging to the desperate and the displaced. The communists (KPD) also grew in the early 1930s, suggesting the depression drove voters towards extremism generally; what made the difference was the Nazis\' superior organisation and propaganda.\n\nIn conclusion, I largely agree with the statement to the extent that the depression was the necessary precondition for Nazi electoral success — without mass unemployment and the collapse of confidence in Weimar, Hitler\'s appeal would have remained marginal. However, the depression was not sufficient on its own: it was the combination of economic catastrophe, the Weimar Republic\'s constitutional vulnerabilities, and the Nazis\' extraordinary propaganda operation that together allowed Hitler to reach the chancellorship. The depression opened the door; Nazi organisation and conservative miscalculation pushed it open.',
diff:['Grade 5 agrees then lists other factors, with no judgement about relative importance. Grade 8 gives a clear "necessary but not sufficient" argument throughout','Grade 8 identifies HOW the depression drove Nazi support — using the statistical correlation of seats (12 → 230) and dates','Grade 8\'s "clever however" on propaganda actually acknowledges the depression drove extremism generally, then explains what made Nazis specifically benefit — a sophisticated distinction','Grade 8 conclusion gives DEGREE: depression was necessary precondition but not sufficient — identifies exactly what else was required']}
],
spellings:[['chancellor','The head of government in Germany (chan-cel-lor — two Ls at the end)'],['Reichstag','The German parliament building (Reichs-tag — "Reich" = empire/realm, "tag" = day/meeting)'],['propaganda','Information used to promote a political cause — often misleading (prop-a-gan-da — four syllables)'],['Führer','Leader/Guide — Hitler\'s title (füh-rer — the ü is pronounced like "ew")'],['Weimar','The town where Germany\'s constitution was written (Vy-mar — not "Wee-mar")']]},

{id:'nazi',num:3,title:'Nazi Germany',dates:'1933–1945',icon:'⚠️',
facts:[
['Night of Long Knives (30 June – 2 July 1934)','Hitler ordered the SS to kill the SA leadership, including Ernst Röhm, the SA commander. Around 400 people were murdered. Reasons: the army (essential for rearmament) wanted the SA eliminated; Röhm was calling for a "second revolution" threatening the conservative establishment; Hitler feared a rival power base. The army was now loyal to Hitler personally.'],
['Hitler becomes Führer (August 1934)','When President Hindenburg died on 2 August 1934, Hitler merged the roles of Chancellor and President, declaring himself Führer (Supreme Leader). The army swore a personal oath of loyalty to Hitler — not to Germany or the constitution. Hitler now had supreme political and military authority with no institutional checks remaining.'],
['The Nazi police state — terror and control','Heinrich Himmler commanded the SS (Schutzstaffel) and the Gestapo (secret police). By 1937 there were an estimated 160,000 paid informers in Germany — neighbour reported neighbour. The SD (intelligence service) monitored opposition. Concentration camps held political opponents. Fear of arrest made open opposition almost impossible. The regime relied on both genuine popularity AND fear.'],
['Goebbels and Nazi propaganda','Joseph Goebbels was Minister of Public Enlightenment and Propaganda from 1933. He controlled all media: radio (cheap "people\'s receivers" sold widely), cinema (newsreels, propaganda films including Riefenstahl\'s "Triumph of the Will"), newspapers, art, music. Nuremberg Rallies — massive staged events attended by hundreds of thousands — projected an image of invincible power and national unity.'],
['Nazi racial policy — Nuremberg Laws (1935)','The Nuremberg Laws (September 1935) stripped German Jews of citizenship and banned marriage between Jews and non-Jews. Jews were increasingly excluded from public life — fired from professions, banned from public places, businesses boycotted. The laws provided a "legal" framework for discrimination. By 1938, approximately 150,000 Jews had emigrated.'],
['Kristallnacht (9–10 November 1938)','The "Night of Broken Glass." Following the murder of a German diplomat in Paris by a young Jewish man, the Nazis orchestrated a nationwide pogrom: 7,500 Jewish businesses smashed, 400 synagogues burned, 91 Jews killed, 30,000 sent to concentration camps. Kristallnacht marked a sharp escalation in anti-Jewish violence — the beginning of systematic destruction rather than discrimination.'],
['Life for women and young people in Nazi Germany','Women: Kinder, Küche, Kirche (Children, Kitchen, Church). Incentivised to have children — marriage loans (reduced for each child), Mother\'s Cross medal for large families. Removed from professions. Young People: Hitler Youth (boys — military fitness, ideological training), League of German Girls/BdM (girls — homemaking, fitness). Membership effectively compulsory by 1939 — 8 million members by 1939.'],
['The Nazi economy','Hjalmar Schacht (Economics Minister) introduced the "New Plan" (1934): strict control of imports, bilateral trade deals, rearmament spending. Unemployment fell from 6 million (1933) to under 1 million by 1938 — though partly through labour schemes (autobahns, RAD) and rearmament. By 1939 Germany was spending 25% of national income on arms. Standard of living for most Germans improved in the 1930s.']
],

people:[
{name:'Joseph Goebbels',role:'Minister of Public Enlightenment and Propaganda (1933–1945)',sig:'Controlled all German media with extraordinary efficiency. Created the cult of Hitler as messianic leader. The Nuremberg Rallies were his masterpiece — creating a sense of irresistible national unity.'},

],
questions:[
{type:'EXPLAIN WHY',marks:12,mins:15,q:'Explain why Hitler was able to consolidate his power in Germany in the years 1933–1934. You may use the following in your answer: the Reichstag Fire; the Night of Long Knives. You must also use information of your own.',bullets:['Reichstag Fire → Emergency Decree → suspended civil liberties March 1933','Enabling Act (March 1933) — Hitler could make law without parliament','Night of Long Knives (June 1934) — eliminated SA, secured army loyalty','Hindenburg\'s death (August 1934) — Hitler merges Chancellor and President'],
g5:'Hitler was able to consolidate his power for several reasons. Firstly, the Reichstag Fire in February 1933 helped Hitler because he used it to pass a decree suspending civil liberties. This helped him because he could arrest opponents. Secondly, the Enabling Act in March 1933 gave Hitler the power to make laws without the Reichstag. This was very important. Thirdly, the Night of Long Knives in June 1934 removed the SA leaders who were a threat to Hitler. In conclusion, Hitler consolidated power through these events.',
g8:'Hitler\'s consolidation of power in 1933–34 followed a deliberate and rapid sequence in which each step created the conditions for the next, moving from legal authority to absolute dictatorship within just 18 months.\n\nThe Reichstag Fire of 27 February 1933 provided Hitler with the perfect pretext to eliminate political opposition. By blaming the fire on communist conspiracy, Hitler persuaded Hindenburg to sign the Reichstag Fire Decree, suspending civil liberties including the right to free speech and fair trial. This allowed the Nazis to arrest thousands of political opponents before the March 1933 election. Consequently, when the Enabling Act came to a vote on 23 March 1933, the chamber was purged of effective opposition — it passed 444 to 94, giving Hitler power to rule by decree for four years. Together, these two events dismantled parliamentary democracy within six weeks of Hitler becoming Chancellor.\n\nHowever, Hitler still faced a significant challenge: the SA under Ernst Röhm was becoming a rival power base, and the regular army — essential for Hitler\'s rearmament plans — would not accept subordination to Röhm\'s street fighters. The Night of Long Knives (30 June–2 July 1934) resolved both problems simultaneously. Hitler ordered the SS to murder Röhm and approximately 400 SA leaders. The army, grateful for the elimination of its rival, agreed to swear a personal oath of loyalty to Hitler — not to Germany. When Hindenburg died in August 1934, Hitler was able to merge Chancellor and President with no institutional resistance. This was the decisive final step: there was now no constitutional, military, or political mechanism to challenge Hitler\'s authority.',
diff:['Grade 5 describes each event separately without showing HOW each one enabled the next. Grade 8 explicitly shows the CHAIN of causation','Grade 8 explains WHY each event mattered to consolidation — the Reichstag Fire gave "pretext," the Night of Long Knives resolved the "rival power base" problem','Grade 8 uses precise evidence: "444 to 94," "30 June–2 July," "personal oath of loyalty to Hitler" — specificity earns marks','Grade 5 conclusion just summarises. Grade 8 uses the phrase "decisive final step" — showing which event mattered most']},
{type:'HOW FAR DO YOU AGREE',marks:20,mins:22,q:'"Nazi Germany was a totalitarian state in which all aspects of life were controlled by the government." How far do you agree with this statement? Explain your answer.',bullets:['Evidence of control: propaganda, SS/Gestapo, youth organisations, women\'s roles','Evidence of limits: church opposition, some continued private resistance, popular consent more important than force','Economic policy — genuine improvement in living standards alongside control','Volksgemeinschaft — the "people\'s community" vision'],
g5:'I agree with this statement. Nazi Germany was a totalitarian state. Goebbels controlled the media and propaganda. The Gestapo arrested people who opposed Hitler. The Hitler Youth controlled young people\'s lives. Women were told to be mothers. However, some people did resist. The churches sometimes spoke out against the Nazis. In conclusion, Nazi Germany was mostly a totalitarian state but not all aspects of life were completely controlled.',
g8:'I largely agree that the Nazis sought to control all aspects of German life, but the degree of success varied significantly — the regime was most effective in the public sphere and least effective in private belief and religious life. Describing Nazi Germany simply as "totalitarian" therefore requires significant qualification.\n\nThe Nazis\' control of the public sphere was extensive and effective. Goebbels\' propaganda apparatus dominated all mass media — radio, cinema, newspapers, art — creating a carefully managed national narrative of German greatness and racial purity. The Hitler Youth (8 million members by 1939) and League of German Girls ensured the regime shaped the values of the next generation. The Gestapo\'s network of informers — estimated at 160,000 paid informers by 1937 — created a pervasive atmosphere of surveillance in which open opposition was suicidal. This therefore supports the statement: in the public domain, few regimes before or after have achieved such comprehensive control.\n\nHowever, the regime\'s control of private belief and conscience was much more limited. The Protestant and Catholic churches proved largely resistant to full Nazification — Pastor Niemöller\'s Confessing Church actively resisted, and Pope Pius XI\'s 1937 encyclical "Mit brennender Sorge" (With Burning Anxiety) criticised Nazi ideology and was read from German Catholic pulpits. The Edelweiss Pirates and Swing Youth movements showed that some young people rejected Nazi culture. This suggests that control of outward behaviour was not the same as control of inner conviction.\n\nIn conclusion, Nazi Germany was totalitarian in its ambitions and largely totalitarian in the public sphere — the regime controlled what Germans heard, saw, and could publicly express with extraordinary effectiveness. However, the statement overstates the degree of control over private belief, religious life, and the limits of active resistance. The regime ultimately relied on a combination of genuine popular support (particularly for economic recovery) and fear, rather than total control of every aspect of life.',
diff:['Grade 5 agrees then notes exception without analysis. Grade 8 draws a precise distinction between public sphere control (extensive) vs private belief (limited)','Grade 8 gives SPECIFIC evidence for limits on control: Niemöller, "Mit brennender Sorge," Edelweiss Pirates — not just "some people resisted"','Grade 8 ends with a nuanced degree: totalitarian in public sphere but "the statement overstates control of private belief" — this is sophisticated','Spelling note: Kristallnacht, Gestapo, Wehrmacht, Volksgemeinschaft need to be learned cold']}
],
spellings:[['Kristallnacht','Night of Broken Glass (Kris-tall-nacht — three syllables; "Kris" not "Chris")'],['Gestapo','Secret police (Ge-sta-po — from GEheime STAatsPOlizei)'],['Wehrmacht','German armed forces (Vehr-makt — the "W" is pronounced "V" in German)'],['Volksgemeinschaft','People\'s community (Volks-ge-mine-shaft — compound word, say each part)'],['Lebensraum','Living space (Lay-bens-rowm — "raum" rhymes with "room" almost)'],['Anschluss','Union with Austria 1938 (An-shluss — "sch" is like "sh" in German)']]}
]},

{id:'con',icon:'🌍',tag:'AQA 8145BC — Section B',title:'Conflict and Tension 1918–1939',desc:'Paris Peace Conference · League of Nations · Road to War',col:'var(--con)',
topics:[
{id:'paris',num:1,title:'The Paris Peace Settlement',dates:'1919',icon:'✍️',
facts:[
['The Paris Peace Conference (January 1919)','World leaders met in Paris to decide the shape of post-WWI Europe. The "Big Three" dominated: President Wilson (USA), Prime Minister Lloyd George (Britain), Prime Minister Clemenceau (France). Germany was excluded from negotiations — forced to accept the final terms or face resumption of war. The conference produced five treaties for the defeated powers.'],
['Wilson\'s aims (USA)','President Woodrow Wilson brought his "14 Points" — a blueprint for a lasting peace: self-determination for all nations, freedom of the seas, arms reduction, no secret treaties, and above all a League of Nations to resolve future disputes peacefully. Wilson was idealistic — he believed in creating a just peace that would make future war impossible. Ironically, the US Congress refused to join the League he created.'],
['Clemenceau\'s aims (France)','Clemenceau (nicknamed "the Tiger") represented a France devastated by four years of fighting on its own soil. He wanted Germany permanently crippled: maximum reparations, German army destroyed, Rhineland permanently separated from Germany, Saarland given to France, Germany unable to ever threaten France again. He opposed Wilson\'s idealism — "God gave us the Ten Commandments, and we broke them. Wilson gives us the Fourteen Points — we shall see."'],
['Lloyd George\'s aims (Britain)','Lloyd George took a middle position. He had just won an election on promises to "squeeze Germany until the pips squeak." But privately he wanted a moderate settlement — a ruined Germany could not trade with Britain, and a humiliated Germany might turn to communism. He feared creating conditions for another war. He largely failed to moderate Clemenceau\'s demands.'],
['The Treaty of Versailles — key terms','War Guilt Clause (Article 231): Germany accepted sole responsibility for WWI. Reparations: £6.6 billion (finalised 1921). Military: army of 100,000 men, no air force, 6 battleships, no submarines, Rhineland demilitarised. Territory: Alsace-Lorraine to France, Eupen and Malmedy to Belgium, North Schleswig to Denmark, Polish Corridor created (splitting Germany), Saarland under League for 15 years, all colonies taken.'],
['German reaction to Versailles','Germany called it a "diktat" (dictated peace). The War Guilt Clause was seen as a national humiliation — Germany did not feel solely responsible for WWI. Reparations were felt to be economically crippling. The loss of territory meant 3.5 million ethnic Germans now lived outside Germany. Politicians who signed Versailles were labelled "November Criminals" and "traitors." The resentment created by Versailles was a major factor in Hitler\'s rise to power.'],
['Other Peace Treaties (1919–1920)','Treaty of St Germain (1919): broke up Austria-Hungary; Austria forbidden to unite with Germany. Treaty of Trianon (1920): Hungary lost 2/3 of its territory. Treaty of Neuilly (1919): Bulgaria lost land to Greece and Yugoslavia. Treaty of Sèvres (1920): dismantled the Ottoman Empire. Self-determination was unevenly applied — applied to Germany\'s enemies but not to create a "Greater Germany."'],
['Was Versailles too harsh or too lenient?','Too harsh view: War Guilt humiliating; reparations economically crippling; no German participation; sowed seeds of WWII. Too lenient view: Germany survived as a single nation; key industrial areas (Ruhr) remained; France got no permanent Rhine frontier; Germany was not occupied. Reality: it was harsh enough to cause deep resentment but not harsh enough to prevent Germany from recovering and eventually seeking revenge.']
],

['11 Nov 1918','Armistice signed — WWI ends; Germany not invaded or occupied'],
