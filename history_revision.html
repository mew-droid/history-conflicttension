],
people:[
{name:'Woodrow Wilson',role:'US President — idealist peacemaker',sig:'Proposed the 14 Points including self-determination and the League of Nations. Wanted a "peace without victory." His health collapsed during negotiations. Ultimately failed to convince US Congress to join the League — his greatest achievement was undone at home.'},
{name:'Georges Clemenceau',role:'French Prime Minister — "the Tiger"',sig:'Represented a France scarred by four years of fighting on home soil and desperate for security. Pushed hardest for punishing Germany. Partly got what he wanted — but told his colleagues the treaty "is not a peace. It is an armistice for twenty years." He was right.'},
{name:'David Lloyd George',role:'British Prime Minister — the pragmatist',sig:'Publicly promised to "squeeze Germany." Privately worried about creating conditions for another war. Wrote in March 1919: "We shall have to fight another war again in 25 years." Also proved prescient. Largely outmanoeuvred by Clemenceau.'}
],
questions:[
{type:'SOURCE INFERENCE',marks:4,mins:6,q:'Study Source A. Source A shows the Big Three at the Paris Peace Conference. What can you infer from the positions and expressions shown about attitudes towards the peace settlement?\n\n[Note: In your exam, an actual source image or quotation will be provided. This question teaches the inference technique.]',bullets:['Make 2–3 inferences — things the source IMPLIES, not just what it shows','Use a specific detail from the source to support each inference','Do NOT just describe what you see — go BEYOND the source'],
g5:'Source A shows the Big Three at the Paris Peace Conference. I can see three men. This shows that the main leaders of the Allied powers were at the conference. The source tells me that there were important meetings held at the conference. I can also see that they are in a formal setting which shows it was an important event.',
g8:'From Source A, I can infer that there was significant tension between the key leaders at the Paris Peace Conference, despite their formal presentation. The [specific detail from source, e.g. body language/spatial arrangement/expressions] suggests that the leaders were not fully united in their aims. This is supported by the historical context: Wilson\'s idealistic 14 Points clashed fundamentally with Clemenceau\'s desire to permanently weaken Germany — the two men had very different visions for the peace settlement.\n\nI can also infer that the peace settlement was dominated by Allied interests rather than Wilson\'s principles of self-determination and collective security. [Specific detail from source] indicates that the major powers held the decisive authority, with Germany entirely excluded from the negotiations — a fact that would fuel German resentment and undermine the legitimacy of the Versailles Treaty.',
diff:['Grade 5 DESCRIBES what is in the source. Grade 8 makes INFERENCES — things the source implies or suggests beyond what is directly shown','Grade 8 uses a specific detail from the source AND connects it to historical context — explaining WHY the inference is historically significant','Grade 5 says "this shows an important event." Grade 8 says "this suggests tension because..." — always go BEYOND the surface','The key word is INFER not DESCRIBE. Ask: "What does this SUGGEST? What does this IMPLY?"']},
{type:'HOW FAR DO YOU AGREE',marks:20,mins:22,q:'"The Treaty of Versailles was a fair punishment for Germany." How far do you agree with this statement? Explain your answer.',bullets:['Evidence it was fair: Germany had caused devastation; Britain and France had to rebuild; Clemenceau\'s security needs were real','Evidence it was unfair: war guilt clause — shared responsibility; reparations crippled economy; German populations left in foreign states; Germany excluded from negotiations','Long-term consequences: created resentment that fuelled Nazi rise; Clemenceau predicted "armistice for 20 years"'],
g5:'I disagree with this statement. The Treaty of Versailles was not fair. Germany was forced to accept the War Guilt Clause which blamed Germany for the whole war. Germany also had to pay £6.6 billion in reparations which was very harsh. Germany also lost 13% of its land. These terms were very unfair. However, some people might say it was fair because Germany had caused a lot of damage in WWI. In conclusion, I disagree because the terms were too harsh.',
g8:'I largely disagree that the Treaty of Versailles represented fair punishment for Germany, though the question of "fairness" depends significantly on whose perspective one adopts and what criteria are applied.\n\nThe case for fairness rests on the genuine devastation that Allied powers had suffered. France lost over 1.3 million soldiers and 10% of its industrial capacity was destroyed. Britain spent the equivalent of £11 billion fighting a war triggered in part by German militarism. From Clemenceau\'s perspective, demanding reparations and military restriction was not punishment but necessary compensation for catastrophic losses — if Germany had won, it would have imposed far harsher terms, as the Treaty of Brest-Litovsk with Russia (1918) demonstrated. This therefore challenges the statement\'s implied criticism: the allies had legitimate grievances.\n\nHowever, the weight of evidence suggests the treaty was profoundly unfair in both its content and its process. The War Guilt Clause was historically indefensible: WWI resulted from the decisions of many powers — Austria-Hungary, Russia, and Britain bore significant responsibility alongside Germany. Forcing Germany to accept sole guilt was a political fiction used to justify reparations, not an honest assessment. Furthermore, the £6.6 billion figure was economically crippling — Keynes called it "a Carthaginian peace" — and the exclusion of Germany from negotiations meant the treaty lacked the moral legitimacy of an agreed settlement. It was a diktat.\n\nIn conclusion, I largely disagree with the statement because the Versailles Treaty\'s unfairness was ultimately self-defeating. Clemenceau himself acknowledged this, predicting it was "an armistice for twenty years." The treaty was harsh enough to create deep and lasting resentment among ordinary Germans — resentment that Hitler exploited — but not harsh enough to prevent Germany from recovering its industrial capacity and seeking revision. A genuinely fair settlement might have been less harsh but more durable. The real failure of Versailles was not that it punished Germany too harshly, but that it punished Germany in ways that stored up catastrophe for the future.',
diff:['Grade 5 just agrees/disagrees with the title. Grade 8 interrogates the term "fair" — fairness depends on whose perspective you adopt','Grade 8\'s paragraph on "the case for fairness" is genuine — uses specific evidence (Brest-Litovsk, 1.3 million French casualties). The counter-argument is real, not token','Grade 8 conclusion introduces the idea of "self-defeating punishment" — a sophisticated argument about long-term consequences that is explicitly historical rather than moralising','SPaG note: Versailles, reparations, sovereignty — practise these spellings']}
],
spellings:[['Versailles','The palace where the treaty was signed (Ver-sigh — silent "s" and "l", ends in "eye")'],['reparations','Payments to compensate for war damage (rep-a-ray-shuns)'],['sovereignty','Supreme political power/independence (sov-er-en-tee — the "g" is silent)'],['Clemenceau','French PM at Paris Peace Conference (Klem-an-so — French name)'],['armistice','Agreement to stop fighting (arm-is-tis)'],['plebiscite','A public vote on a political question (pleb-i-site)']]},

{id:'league',num:2,title:'The League of Nations',dates:'1920s',icon:'🕊️',
facts:[
['What was the League of Nations?','Set up in 1920 as part of the Versailles Treaty. Woodrow Wilson\'s idea — collective security: if one nation was attacked, all members would defend it. Headquartered in Geneva. Initially had 42 members. KEY WEAKNESS FROM THE START: the USA never joined — the US Senate voted against membership in November 1919. Without the world\'s largest economy, the League\'s sanctions were always going to be limited.'],
['The League\'s structure and tools','Assembly: all member nations met once a year — passed resolutions. Council: permanent members (Britain, France, Italy, Japan — later Germany) met more frequently. Decisions required UNANIMITY — any member could veto action. The League had NO ARMY. Its only tools were: moral condemnation, economic sanctions (stopping trade with rule-breakers), and military force from member nations (who rarely contributed). This structural weakness was fundamental.'],
['The League\'s successes in the 1920s','Aaland Islands (1921): Finland vs Sweden — League ruled in Finland\'s favour; Sweden accepted. Greek-Bulgarian dispute (1925): Greece invaded Bulgaria; League ordered Greece to withdraw; Greece complied. Humanitarian work: freed over 200,000 slaves in Sierra Leone; repatriated 400,000 WWI prisoners of war; founded predecessor of WHO (World Health Organisation). These successes shared one feature: no major power had a strong national interest at stake.'],
['FAILURE: The Vilna Crisis (1920)','Poland seized Vilna from Lithuania. Lithuania appealed to the League. The League did NOTHING — partly because France and Britain were reluctant to confront Poland, which they valued as a buffer against communist Russia. International relations between Poland and Lithuania worsened. Showed the League would not act when major powers had conflicting interests.'],
['FAILURE: The Corfu Crisis (1923)','An Italian general was murdered on the Greek-Albanian border. Mussolini demanded compensation and, when Greece refused, bombed and occupied the Greek island of Corfu. Greece appealed to the League. The League condemned Italy — but when Italy threatened to leave the organisation, the League backed down completely. Greece was forced to pay compensation TO ITALY. Result: the aggressor won. The bully was rewarded. CRITICAL LESSON: the League would not stand up to major powers. ⚠️ DO NOT confuse this with Manchuria (1931) for a 1920s question.'],
['FAILURE: Upper Silesia (1921)','Germany and Poland both claimed the industrial region of Upper Silesia. The League organised a plebiscite (vote). The vote was split — the League divided the region, giving Poland the industrial areas and Germany more land. Both sides were unhappy. The League intervened but created resentment rather than resolution. Example of failure through ineffective action, not just inaction.'],
['The League\'s structural weaknesses — the running thread','These weaknesses explain ALL the failures: (1) USA absent — no economic muscle for sanctions; (2) No army — relied on member nations who often refused; (3) Unanimous decisions required — any veto paralysed action; (4) Slow decision-making — by the time the League responded, situations had changed; (5) Britain and France ran the League but prioritised their own national interests; (6) Germany and USSR initially excluded — weakened global legitimacy.'],
['Why the League only worked for minor disputes','CRITICAL PATTERN TO LEARN: The League succeeded when no major power had a national interest at stake (Aaland Islands — no major power cared who got them). The League failed when a major power was involved (Corfu — Italy was a founding member). This pattern proves the League\'s fundamental flaw: it was only as strong as the willingness of major powers to cooperate — and the moment a major power chose not to, the League was helpless.']
],
dates:[
['Jan 1920','League of Nations officially established in Geneva'],
['Nov 1919','US Senate votes against joining the League — critical blow before it starts'],
['1920','Vilna Crisis — Poland seizes Lithuanian capital; League takes no action'],
['1921','Aaland Islands — League succeeds; Upper Silesia — messy division'],
['1923','Corfu Crisis — Italy bombards Greece; League condemns Italy then backs down; Italy wins'],
['1925','Greek-Bulgarian dispute — League succeeds; Greece withdraws as ordered'],
['1926','Germany finally joins the League of Nations'],
['1931','Manchuria Crisis — Japan invades China (this is a 1930s crisis, NOT 1920s)']
],
people:[
{name:'Woodrow Wilson',role:'Founder and champion of the League',sig:'His 14 Points included the League as the cornerstone of a lasting peace. Tragically, he was unable to persuade the US Senate to join. He suffered a stroke campaigning for membership. The League he founded was crippled from birth by America\'s absence.'},
{name:'Benito Mussolini',role:'Italian dictator — aggressive challenger of the League',sig:'The Corfu Crisis (1923) showed Mussolini he could bully smaller nations and ignore the League. This lesson was not lost on Hitler — if Mussolini could get away with it, so could he. The League\'s failure in Corfu set a dangerous precedent for the 1930s.'},
{name:'Viscount Cecil',role:'British champion of the League',sig:'Led British support for the League in the 1920s. Organised the Peace Ballot of 1935 in which 11 million Britons expressed support for the League. But British governments consistently prioritised national interest over League principles.'}
],
questions:[
{type:'HOW FAR DO YOU AGREE',marks:20,mins:22,q:'"The League of Nations failed more often than it succeeded in the 1920s." How far do you agree with this statement? Explain your answer. [This is a real exam question type — based on your previously marked work.]',bullets:['Structural weakness: USA absent, no army, unanimity required — the root cause of all failures','Corfu Crisis (1923): League condemned Italy then backed down — major power won','Vilna (1920) and Upper Silesia (1921): inaction and ineffective action both count as failures','Successes: Aaland Islands, Greek-Bulgarian dispute, humanitarian work — but all when no major power objected'],
g5:'I mainly agree with the statement. The League of Nations failed more often than it succeeded. One example of failure was the Vilna Crisis in 1920 when Poland took Vilna from Lithuania and the League did nothing. Another failure was the Upper Silesia crisis in 1921 when the League tried to solve the problem but both sides were unhappy. The League also failed in the Corfu Crisis when Italy was allowed to keep the compensation. However, the League did have some successes. It solved the Aaland Islands dispute in 1921 when it ruled in Finland\'s favour and Sweden accepted. The League also did humanitarian work. In conclusion, I mainly agree that the League failed more than it succeeded because of the Vilna, Upper Silesia and Corfu crises.',
g8:'I largely agree with the statement that the League of Nations failed more often than it succeeded in the 1920s, though the pattern of failure is more revealing than the simple count: the League succeeded only when no major power had a national interest at stake, and it consistently failed whenever one did. This structural reality made its failures almost inevitable.\n\nThe most important reason for the League\'s repeated failures was its fundamental structural weakness: the absence of the United States. Although the League was Woodrow Wilson\'s own creation, the US Senate voted against membership in November 1919. Without the world\'s largest economy, the League\'s economic sanctions were fatally undermined — any nation targeted could continue trading with the USA regardless. This was not just one factor among many: it was the root cause that made every other failure more likely. This therefore supports the statement: the League was structurally designed in a way that made decisive action against determined aggressors almost impossible from the outset.\n\nThe Corfu Crisis of 1923 provides the clearest evidence that the League failed when major powers were involved. Mussolini bombarded and occupied the Greek island of Corfu following the murder of an Italian general. Greece appealed to the League, which condemned Italy. However, when Mussolini threatened to leave the organisation, the League reversed course and allowed Italy to collect a substantial financial indemnity from Greece — meaning the aggressor was rewarded for its aggression. This failure was significant beyond the immediate crisis: it sent a clear signal to other would-be aggressors — including Hitler — that the League would not confront a determined major power.\n\nHowever, it would be wrong to say the League never succeeded. The Aaland Islands dispute (1921) and the Greek-Bulgarian crisis (1925) both ended with the League\'s decision being accepted and implemented. The League\'s humanitarian agencies freed over 200,000 slaves and repatriated hundreds of thousands of WWI prisoners. These were genuine achievements. Yet they all share one crucial characteristic: no major power had a compelling national interest in blocking the League\'s decision. This therefore reveals the central limitation of the League\'s successes — they were conditional on the cooperation of those with power.\n\nIn conclusion, I largely agree with the statement. The League did not simply fail more than it succeeded — it was structurally designed in a way that made decisive success almost impossible whenever a major power chose to resist. Its failures — Corfu, Vilna, Upper Silesia — all demonstrate the same underlying weakness: without the USA, without its own army, and with the requirement for unanimity, the League could condemn but could not compel. Its successes, while real, were possible only because the powerful had no reason to object. The League failed more than it succeeded, and its failures mattered far more than its successes.',
diff:['⚠️ KEY IMPROVEMENT from your previous essay: the grade 8 answer uses Corfu (1923) NOT Manchuria (1931). Manchuria was 1931 — outside the 1920s timeframe. Always check your dates against the question.','Grade 8 uses a RUNNING THREAD: every failure paragraph links back to the structural weakness (no USA). This is what sustained judgement looks like.','Grade 8\'s "clever however" on successes acknowledges they were genuine — then immediately shows WHY they don\'t change the overall verdict (conditional on major powers not objecting)','Grade 8 conclusion gives DEGREE: identifies the root cause (structural weakness) and says failures "mattered far more" — not just "mainly agree"']}
],
spellings:[['neutralisation','A chemical reaction? No — in history: making one side neutral (neu-tra-li-ZAY-shun)'],['plebiscite','A public vote (pleb-i-site — often misspelled "plebicite")'],['disarmament','Reduction of military weapons and forces (dis-ARM-a-ment)'],['sovereignty','Supreme power of a state (SOV-er-en-tee)'],['collective','Acting together as a group (col-LECT-ive — double L)'],['Czechoslovakia','Central European country (check-o-slo-VAK-ee-a — seven syllables)']]},

{id:'war',num:3,title:'The Road to War',dates:'1930–1939',icon:'💥',
facts:[
['The Impact of the Great Depression (1929)','The Wall Street Crash triggered a global economic collapse. In Germany, unemployment rose to 6 million by 1932 — which helped bring Hitler to power. Worldwide, democratic governments struggled and nationalism rose. The Depression destroyed the international cooperation that had slowly developed in the late 1920s — nations turned inward, making collective security through the League even harder.'],
['The Manchurian Crisis (1931–1933)','Japan invaded the Chinese province of Manchuria in September 1931, renaming it Manchukuo. China appealed to the League. The League set up the Lytton Commission to investigate (reported in 1932 — Japan had acted illegally). The League condemned Japan — Japan simply left the League in 1933 and kept Manchuria. No sanctions were imposed. Result: the League was shown to be powerless against a determined major power. Aggressors took note.'],
['The Abyssinian Crisis (1935–1936)','Italy invaded Abyssinia (modern Ethiopia) in October 1935. The Emperor Haile Selassie made a famous plea to the League. The League imposed economic sanctions — but crucially excluded oil, which would have crippled Italy. The Hoare-Laval Pact (December 1935): British and French foreign ministers secretly offered Mussolini 2/3 of Abyssinia to stop the war — the scandal destroyed the pact when leaked. Italy conquered Abyssinia by May 1936. The League\'s complete failure ended its credibility.'],
['Remilitarisation of the Rhineland (March 1936)','Hitler sent German troops into the Rhineland — directly violating Articles 42–44 of the Versailles Treaty. By his own later admission, this was his greatest gamble — his generals had orders to withdraw if France opposed them. France did nothing. Britain did nothing. Hitler later said if France had marched, it would have been catastrophic for Germany. This emboldened Hitler to believe further aggression would not be resisted.'],
['Appeasement — what it was and why','The policy of making concessions to aggressive nations to avoid war. Why Britain (Chamberlain) followed it: (1) genuine war-weariness after WWI; (2) belief Germany\'s grievances over Versailles were legitimate; (3) fear of communism — a strong Germany was a buffer against USSR; (4) Britain was not militarily ready for war in 1936–1938; (5) public opinion was against war; (6) underestimated Hitler — thought he was a reasonable statesman.'],
['Anschluss — Union with Austria (March 1938)','Hitler marched German troops into Austria on 12 March 1938, uniting Austria with Germany. This violated the Treaty of St Germain which forbade this union. A staged plebiscite showed 99.75% support (widely accepted as manipulated). Britain and France protested but did nothing. Population of Germany grew from 68 million to 75 million overnight. Hitler had expanded Germany peacefully — his confidence grew.'],
['The Munich Agreement (September 1938)','Hitler demanded the Sudetenland (German-speaking border area of Czechoslovakia). Chamberlain flew to meet Hitler three times. At Munich on 29 September 1938, Chamberlain, Daladier (France), Hitler, and Mussolini agreed to give Hitler the Sudetenland. Czechoslovakia was not invited to the meeting. Chamberlain returned claiming "peace in our time." Churchill called it "a total and unmitigated defeat." This was the high point of appeasement — and its last attempt.'],
['The End of Appeasement and the Outbreak of War','In March 1939, Hitler invaded and occupied the rest of Czechoslovakia — breaking the Munich Agreement. Appeasement was abandoned. Britain and France issued guarantees of Polish independence. On 23 August 1939, the Nazi-Soviet Non-Aggression Pact was signed — Germany and the USSR agreed not to attack each other, freeing Hitler to invade Poland. On 1 September 1939, Germany invaded Poland. On 3 September 1939, Britain and France declared war on Germany. WWII had begun.']
],
dates:[
['Sep 1931','Japan invades Manchuria; League investigation reveals aggression but takes no effective action'],
['Jan 1933','Hitler becomes Chancellor; Germany begins secret rearmament'],
['Oct 1933','Germany leaves the League of Nations'],
['Oct 1935','Italy invades Abyssinia; League imposes partial sanctions (no oil)'],
['Mar 1936','Remilitarisation of the Rhineland — direct violation of Versailles; France/Britain do nothing'],
['Oct 1936','Rome-Berlin Axis — Hitler and Mussolini formally ally'],
['Mar 1938','Anschluss — Germany unites with Austria'],
['Sep 1938','Munich Agreement — Britain/France give Hitler the Sudetenland'],
['Mar 1939','Hitler invades rest of Czechoslovakia — appeasement ends'],
['23 Aug 1939','Nazi-Soviet Non-Aggression Pact — USSR agrees not to attack Germany'],
['1 Sep 1939','Germany invades Poland — WWII begins'],
['3 Sep 1939','Britain and France declare war on Germany']
],
people:[
{name:'Neville Chamberlain',role:'British Prime Minister (1937–1940) — architect of appeasement',sig:'Flew to meet Hitler three times before Munich. Genuinely believed he could negotiate lasting peace. Returned from Munich claiming "peace in our time." In March 1939, Hitler\'s invasion of Czechoslovakia proved him catastrophically wrong. Despite this, Britain was not militarily ready for war in 1938 — appeasement may have bought valuable time.'},
{name:'Adolf Hitler',role:'German Chancellor and Führer — systematic dismantler of Versailles',sig:'Each act of aggression was a test of Allied resolve. Remilitarisation, Anschluss, Sudetenland — each went unanswered. He concluded Britain and France were weak and would not fight. This miscalculation led him to invade Poland — and triggered the war he thought he could avoid until Germany was stronger.'},
{name:'Winston Churchill',role:'MP and vocal critic of appeasement',sig:'Consistently warned that appeasing Hitler was a catastrophic mistake. Called the Munich Agreement "a total and unmitigated defeat." Became Prime Minister in May 1940. His judgement on appeasement was vindicated by events — but it is worth noting he was in the minority at the time.'}
],
questions:[
{type:'HOW FAR DO YOU AGREE',marks:20,mins:22,q:'"The main reason for the outbreak of war in 1939 was Hitler\'s foreign policy." How far do you agree with this statement? Explain your answer.',bullets:['Hitler\'s foreign policy — systematic dismantling of Versailles, each step more aggressive','The failure of the League of Nations — set precedents that aggression paid','The policy of appeasement — encouraged Hitler to believe he could act without consequences','The role of the Great Depression — nationalism, weak democracies'],
g5:'I agree with this statement. Hitler\'s foreign policy was very important in causing the war. Hitler remilitarised the Rhineland in 1936, which broke the Treaty of Versailles. He also carried out the Anschluss in 1938 uniting Germany with Austria. The Munich Agreement gave Hitler the Sudetenland in 1938. These actions showed Hitler was becoming more aggressive. However, appeasement also caused the war because it encouraged Hitler. In conclusion, Hitler\'s foreign policy was the main reason for war.',
g8:'I largely agree that Hitler\'s foreign policy was the most significant cause of the outbreak of war in 1939, because it was Hitler\'s deliberate decision to invade Poland on 1 September 1939 that directly triggered the conflict. However, Hitler\'s foreign policy operated within a context created by other factors — particularly the failure of the League of Nations and the policy of appeasement — that made his aggression possible and, ultimately, inevitable.\n\nHitler\'s foreign policy followed a clear strategic pattern: systematic dismantling of the Versailles Treaty through a series of carefully calibrated risks. The remilitarisation of the Rhineland (1936) was Hitler\'s greatest gamble — he later admitted his troops had orders to withdraw if France opposed them. When France and Britain did nothing, Hitler concluded that the democratic powers lacked the will to fight. This was the crucial turning point. The Anschluss (March 1938) united 7 million Austrians with Germany without a shot being fired; the Munich Agreement (September 1938) then confirmed that Britain and France would sacrifice other nations to avoid war. Each concession encouraged Hitler to push further — this therefore strongly supports the statement: Hitler\'s calculated aggression was the direct cause of war.\n\nHowever, appeasement must be recognised as an enabling factor that transformed Hitler\'s ambitions from a distant threat into an immediate one. Chamberlain\'s decision to give Hitler the Sudetenland at Munich in September 1938 — meeting three times and flying to Germany in person — sent a clear signal of weakness. Churchill called it "a total and unmitigated defeat." By legitimising Hitler\'s territorial demands, appeasement undermined the credibility of Britain and France\'s eventual guarantee of Polish independence. When Hitler invaded Poland, he genuinely believed the Allies would again back down — a calculation that proved wrong, but one that appeasement had given him every reason to make.\n\nIn conclusion, I largely agree with the statement: Hitler\'s foreign policy was the necessary and sufficient cause of war in the sense that without his deliberate decision to invade Poland, war would not have begun in September 1939. However, appeasement and the failure of the League of Nations created the permissive environment in which Hitler could pursue that policy with reduced risk. War broke out when it did because Hitler miscalculated — he thought Britain and France would again capitulate, as they had over every previous violation. The war\'s timing and form was Hitler\'s responsibility; the conditions that emboldened him were shared.',
diff:['Grade 5 just lists Hitler\'s actions without explaining how they caused war. Grade 8 shows the CHAIN: each concession → Hitler more confident → escalation → war','Grade 8 identifies the "crucial turning point" — the Rhineland — and explains WHY it mattered (Hitler drew the conclusion that democracies lacked will). This is analysis.','Grade 8 gives appeasement a precise role: it didn\'t cause war but it "created the permissive environment" — a sophisticated distinction','Grade 8 conclusion gives degree: Hitler\'s policy was "necessary AND sufficient" but then immediately qualifies this by identifying what appeasement contributed — not just "main reason but others too"']}
],
spellings:[['appeasement','Policy of giving in to demands to avoid conflict (a-PEACE-ment — think "peace" inside it)'],['Abyssinia','Modern Ethiopia — invaded by Italy 1935 (Ab-is-SIN-ee-a — four syllables)'],['Rhineland','German region demilitarised by Versailles (Rhine-land — named after the Rhine river)'],['Sudetenland','German-speaking region of Czechoslovakia (Soo-DAY-ten-land)'],['remilitarisation','Sending troops back into a demilitarised zone (re-mil-i-ta-ri-ZAY-shun — long word, say each part)'],['Chamberlain','British PM — architect of appeasement (Cham-ber-lain — three syllables)']]
}
]},

function secPct(secId){
  const sec=D.sections.find(s=>s.id===secId);
  if(!sec||!sec.topics)return 0;
  let done=0,total=0;
  sec.topics.forEach(t=>{total+=3;['facts','q','sp'].forEach(a=>{if(isDone(secId+'-'+t.id+'-'+a))done++;});});
  return total?Math.round(done/total*100):0;
}
function totalPct(){
  let done=0,total=0;
  D.sections.filter(s=>s.topics).forEach(s=>{s.topics.forEach(t=>{total+=3;['facts','q','sp'].forEach(a=>{if(isDone(s.id+'-'+t.id+'-'+a))done++;});});});
  return total?Math.round(done/total*100):0;
}
function getSec(){return D.sections.find(s=>s.id===ST.secId);}
function getTopic(){const s=getSec();return s&&s.topics?s.topics.find(t=>t.id===ST.topicId):null;}

// TIMER
function startTimer(secs,hints){
  if(ST.timerInt)clearInterval(ST.timerInt);
  ST.timerSecs=secs;ST.timerTotal=secs;ST.timerRunning=true;ST.timerHints=hints||[];
  ST.timerInt=setInterval(()=>{
    if(ST.timerSecs>0){ST.timerSecs--;renderTimerPanel();}
    else{clearInterval(ST.timerInt);ST.timerRunning=false;renderTimerPanel();}
  },1000);
  renderTimerPanel();
}
function stopTimer(){if(ST.timerInt)clearInterval(ST.timerInt);ST.timerRunning=false;renderTimerPanel();}
function renderTimerPanel(){
  const el=document.getElementById('timer-panel');if(!el)return;
  const s=ST.timerSecs,t=ST.timerTotal;
  const pct=t?Math.round((s/t)*100):0;
  const m=Math.floor(s/60),sec=s%60;
  const col=pct>50?'green':pct>20?'amber':'red';
  const bgCol=pct>50?'var(--grn)':pct>20?'var(--gold)':'var(--red)';
  el.innerHTML=`<div class="timer-row">
<div class="timer-display ${col}">${m}:${sec.toString().padStart(2,'0')}</div>
<div class="timer-label"><strong>${ST.timerRunning?'Time remaining':'Time up!'}</strong>${ST.timerRunning?`${Math.round(pct)}% remaining`:'Write your conclusion now'}</div>
</div>
<div class="timer-prog"><div class="timer-pfill" style="width:${pct}%;background:${bgCol}"></div></div>
${ST.timerHints.length?`<div class="timer-hints"><p>📍 Pacing guide</p>${ST.timerHints.map(h=>`<div class="hint-item"><span>${h.t}</span> — ${h.l}</div>`).join('')}</div>`:''}
<div class="timer-btns">
${ST.timerRunning?`<button class="tbtn stop" id="stop-timer">Stop timer</button>`:`<button class="tbtn" id="restart-timer">Restart</button>`}
<button class="tbtn" id="close-timer">Close</button>
</div>`;
  document.getElementById('stop-timer')?.addEventListener('click',stopTimer);
  document.getElementById('restart-timer')?.addEventListener('click',()=>startTimer(ST.timerTotal,ST.timerHints));
  document.getElementById('close-timer')?.addEventListener('click',()=>{stopTimer();document.getElementById('timer-panel').style.display='none';});
}

</div>`;

  // ESSAY STRUCTURE
  h+=`<div class="sec-title">Essay Structure — 20-mark "How far do you agree" questions</div>

<div class="struct-item"><div class="struct-num">1</div><div class="struct-body"><div class="struct-title">Introduction — take a CLEAR position immediately</div><div class="struct-desc">Don't sit on the fence. "I largely agree with this statement because..." or "I disagree to a significant extent, though..." State your 2–3 main reasons in the introduction. Brief mention of counter-argument. Do NOT just repeat the question.</div><div class="struct-time">⏱ 2 minutes</div></div></div>
<div class="struct-item"><div class="struct-num">2</div><div class="struct-body"><div class="struct-title">Paragraph 1 — strongest argument FOR the statement</div><div class="struct-desc">POINT → EVIDENCE (named, dated example) → EXPLAIN why this matters → LINK BACK: "This therefore supports the statement because..." End with a judgement sentence about significance.</div><div class="struct-time">⏱ 5 minutes</div></div></div>
<div class="struct-item"><div class="struct-num">3</div><div class="struct-body"><div class="struct-title">Paragraph 2 — second argument FOR the statement</div><div class="struct-desc">Different factor, same structure. Link back to the same root cause if possible — this builds a sustained argument, not isolated points. "Furthermore..." or "This was compounded by..."</div><div class="struct-time">⏱ 5 minutes</div></div></div>
<div class="struct-item"><div class="struct-num">4</div><div class="struct-body"><div class="struct-title">Paragraph 3 — "However" (the Clever However)</div><div class="struct-desc">Acknowledge the counter-argument GENUINELY — with real evidence. Then show WHY it doesn't change your overall verdict. The pattern for successes: they only happened when no major power objected. This is not "I agree but..." — it's a real argument that you then defeat with evidence.</div><div class="struct-time">⏱ 4–5 minutes</div></div></div>
<div class="struct-item"><div class="struct-num">5</div><div class="struct-body"><div class="struct-title">Conclusion — DEGREE, not just "I mainly agree"</div><div class="struct-desc">Do not just repeat your introduction. Give the DEGREE: HOW MUCH do you agree and WHY? Identify the single root cause that explains the most. "The [X] was not simply a failure — it was structurally designed in a way that made success impossible whenever [Y]." Refer back to specific named examples.</div><div class="struct-time">⏱ 3 minutes</div></div></div>
</div>`;

<div class="sa-step"><div class="sa-step-num">Step 2</div><div class="sa-step-title">Make an INFERENCE — not a description</div><div class="sa-step-text">A description says what is there. An inference says what it suggests. "The source shows three men" = description. "The source suggests tension between the leaders because the body language indicates..." = inference.</div></div>

<div class="sa-step"><div class="sa-step-num">Step 4</div><div class="sa-step-title">Connect to historical context</div><div class="sa-step-text">The top marks go to students who connect the inference to what they know: "This is supported by the historical context: at the Paris Peace Conference, Wilson and Clemenceau fundamentally disagreed about..."</div></div>
<div class="sa-template"><em>Template:</em> "From Source [X], I can infer that [INFERENCE]. This is suggested by [SPECIFIC DETAIL FROM SOURCE], which implies [WHAT IT SUGGESTS]. This connects to the historical context: [WHAT YOU KNOW]."</div>`;

  // LINKING PHRASES BANK
  h+=`<div class="sec-title">Linking Phrase Bank — use at least 4 per essay</div>

  const phrases=['This therefore supports the statement because...','This challenges the statement to the extent that...','Consequently, [x] was destined to fail whenever...','This links directly to the structural weakness because...','However, it would be wrong to say that...','These successes share one crucial characteristic:...','By contrast, when [major power] had something to gain...','This means that the failures outweigh the successes because...','The degree to which I agree is limited because...','This was not simply [X] — it was structurally designed in a way that...'];

<div class="spag-tip"><strong>Rule 3 — Spell your key terms correctly:</strong> Versailles (not "Versaille"), reparations (not "repairations"), Rhineland (not "Reinland"), Czechoslovakia (not "Checkoslavakia"), plebiscite (not "plebescite").</div>
<div class="spag-tip"><strong>Rule 4 — Vary your sentence starters:</strong> Don't start three sentences in a row with "Hitler." Use: "As a result," "Consequently," "However," "Furthermore," "By contrast," "This meant that..."</div>
<div class="spag-tip"><strong>Rule 5 — Read back through your essay:</strong> Spend the last 60–90 seconds ONLY checking SPaG. If you find one error and correct it, that minute was worth it.</div>`;

  // PRE-EXAM CHECKLIST
  h+=`<div class="sec-title">Pre-Exam Essay Checklist</div>`;
  const checks=['I have read the question THREE TIMES and identified the exact timeframe (e.g. "1920s" — do not use 1931 Manchuria)','My introduction takes a clear position AND states my main reasons','Each paragraph has a named, dated example — not just "for example"','Every paragraph ends with a sentence linking back to the statement','I have a genuine "However" paragraph with real counter-evidence','My conclusion gives DEGREE — not just "mainly agree" but specifically why and to what extent','I have used at least 4 different linking phrases (Consequently, Furthermore, This therefore...)','I have read back through for SPaG: capital letters, apostrophes, key spellings'];
  checks.forEach((c,i)=>{
    const done=ST.clState[i];
    h+=`<div class="cl-item${done?' checked':''}" data-cli="${i}"><div class="cl-box">${done?'✓':''}</div><div class="cl-text">${c}</div></div>`;
  });
  h+=`<button class="btn-g" id="cl-reset" style="margin-top:10px;width:100%">Reset checklist</button>`;
  h+=`</div>`;
  return h;
}

  document.querySelectorAll('[data-sec]').forEach(el=>el.addEventListener('click',()=>{

  }));
  document.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>{
    ST.screen='topic';ST.topicId=el.dataset.topic;ST.open=new Set();ST.spState={};ST.revOpen=new Set();ST.tab='facts';render();
  }));
  document.getElementById('bk-home')?.addEventListener('click',()=>{ST.screen='home';ST.secId=null;render();});
  document.getElementById('bk-sec')?.addEventListener('click',()=>{ST.screen='section';ST.topicId=null;ST.open=new Set();ST.tab='facts';render();});
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ST.tab=el.dataset.tab;ST.open=new Set();render();}));
  document.querySelectorAll('[data-fc]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.fc);ST.open.has('f'+i)?ST.open.delete('f'+i):ST.open.add('f'+i);render();
  }));
  document.querySelectorAll('[data-qi]').forEach(el=>el.addEventListener('click',()=>{
    const qi=parseInt(el.dataset.qi);
    const secs=parseInt(el.dataset.secs);
    const t=getTopic();
    const q=t?.questions[qi];
    const hints=q?({20:[{t:'0:00',l:'Plan + intro'},{t:'4:00',l:'Para 1 — for statement'},{t:'9:00',l:'Para 2 — for statement'},{t:'14:00',l:'Para 3 — However counter'},{t:'18:00',l:'Conclusion + degree'},{t:'21:00',l:'SPaG check'}],12:[{t:'0:00',l:'Para 1 — factor + why'},{t:'5:00',l:'Para 2 — factor + why'},{t:'9:00',l:'Para 3 — link factors'},{t:'13:00',l:'SPaG check'}],4:[{t:'0:00',l:'Read source twice'},{t:'1:00',l:'Inference 1 + specific detail'},{t:'3:00',l:'Inference 2 + context'}]}[q.marks]||[]):[]; 
    const panel=document.getElementById('timer-panel-'+qi);
    if(panel){panel.style.display='block';panel.id='timer-panel';ST.timerTotal=secs;startTimer(secs,hints);}
  }));
  document.querySelectorAll('[data-rqi]').forEach(el=>el.addEventListener('click',()=>{
    const qi=parseInt(el.dataset.rqi);
    ST.revOpen.has('q'+qi)?ST.revOpen.delete('q'+qi):ST.revOpen.add('q'+qi);render();
  }));
  document.querySelectorAll('.sp-check').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.spi);
    const input=document.querySelector(`.sp-input[data-spi="${i}"]`);
    const t=getTopic();const sp=t?.spellings[i];
    if(!sp||!input)return;
    const val=input.value.trim();
    const correct=val.toLowerCase()===sp[0].toLowerCase();
    ST.spState[i]={tried:true,correct,val};render();
  }));
  document.querySelectorAll('.sp-input').forEach(el=>el.addEventListener('keypress',e=>{
    if(e.key==='Enter'){const btn=document.querySelector(`.sp-check[data-spi="${el.dataset.spi}"]`);btn?.click();}
  }));
  document.getElementById('sp-reset')?.addEventListener('click',()=>{ST.spState={};render();});
  document.querySelectorAll('.phrase').forEach(el=>el.addEventListener('click',()=>{
    el.classList.toggle('phrase-copied');setTimeout(()=>el.classList.remove('phrase-copied'),1500);
  }));
  document.querySelectorAll('[data-cli]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.cli);
    ST.clState[i]=!ST.clState[i];render();
  }));
  document.getElementById('cl-reset')?.addEventListener('click',()=>{ST.clState={};render();});
}
render();
</script></body></html>
